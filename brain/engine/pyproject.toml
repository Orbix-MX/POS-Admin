[project]
name = "project-brain"
version = "0.1.0"
description = "Motor de conocimiento compartido entre desarrolladores e IA"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.scripts]
brain = "brain.interfaces.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
