[project]
name = "brain-mcp"
version = "0.1.0"
description = "Adaptador MCP de Project Brain: traducción entre el protocolo y la API pública"
requires-python = ">=3.13"
dependencies = [
    "project-brain",
    "mcp>=2.0,<3",
]

[project.scripts]
brain-mcp = "brain_mcp.server:main"

[tool.uv.sources]
project-brain = { path = "../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mcp"]
